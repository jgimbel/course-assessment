[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tjdiag"
version = "0.1.0"
description = "P0601 debugger for a 2004 Jeep Wrangler (TJ) over an ELM327-type OBD2 adapter"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tjdiag = "tjdiag.cli:main"

[tool.setuptools]
packages = ["tjdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
